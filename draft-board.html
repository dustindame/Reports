<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auction Draft Board</title>
  <link rel="stylesheet" href="shared/theme.css?v=20260728f" />
  <link rel="stylesheet" href="shared/league-gate.css?v=20260728f" />
  <link rel="stylesheet" href="draft-board.css?v=20260728i" />
</head>
<body class="turf-bg">
  <div class="board-scroll-wrapper" id="boardScroll">
    <div class="board-content" id="boardContent">

      <div class="nice-flash" id="niceFlash" hidden><span class="nice-flash-text">NICE! NICE! NICE!</span></div>
      <div class="shot-flash" id="shotFlash" hidden><span class="shot-flash-text">SHOT! SHOT! SHOT!</span></div>

      <header class="board-header" id="boardHeader">
        <div class="header-block title-block">
          <h1 class="board-title" id="boardNameText">AUCTION DRAFT BOARD</h1>
        </div>

        <div class="header-block position-totals-block" id="positionTotalsBlock" hidden>
          <div class="recent-label">Drafted by Position</div>
          <div class="position-totals-row" id="positionTotalsRow"></div>
        </div>

        <div class="header-block elapsed-block" id="elapsedBlock" hidden>
          <div class="tracker-label">Elapsed</div>
          <div class="elapsed-value" id="elapsedValue">0m</div>
        </div>

        <div class="header-block recent-block" id="recentBlock">
          <div class="recent-label">Recent Picks</div>
          <div class="recent-strip" id="recentStrip"></div>
        </div>

        <div class="header-block tools-block">
          <button class="tool-btn" id="exportBtn" title="Download a backup of all picks (CSV)"><span id="exportIcon"></span></button>
          <button class="tool-btn" id="snapshotBtn" title="Save the board as an image"><span id="snapshotIcon"></span></button>
          <a class="tool-btn" id="recapLink" href="recap.html" title="View draft recap"><span id="recapIcon"></span></a>
        </div>

        <div class="header-block clock-block">
          <div class="scoreboard-clock">
            <span class="scoreboard-value" id="clockValue">--:--</span>
          </div>
          <div class="tracker-block" id="trackerBlock">
            <div class="tracker-numbers">
              <span class="tracker-value" id="draftedValue">0 / 156</span>
              <span class="tracker-label">drafted · <span id="remainingValue">156</span> left</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          </div>
        </div>

        <div class="header-block qr-block">
          <a class="qr-code" id="qrCode" href="team-picks.html" title="Open Team Picks lookup"></a>
          <div class="qr-caption">Scan to Join</div>
        </div>
      </header>

      <main class="board-grid" id="boardGrid"></main>

      <main class="break-screen" id="breakScreen" hidden>
        <div class="break-banner">
          <span class="break-banner-text">🏈 ON BREAK</span>
          <span class="break-timer" id="breakTimer">0:00</span>
        </div>
        <div class="break-screen-body">
          <div class="break-fact-card">
            <div class="break-section-heading">🏆 Did You Know?</div>
            <div class="break-fact-list" id="breakFactList"></div>
            <div class="break-leaders-heading">🏈 All-Time Leaders</div>
            <div class="break-leaders-list" id="breakLeadersList"></div>
          </div>
          <div class="break-odds-card">
            <div class="break-section-heading">🎲 Season Odds</div>
            <div class="break-odds-note" id="breakOddsNote"></div>
            <div class="break-odds-list" id="breakOddsList"></div>
          </div>
          <div class="break-roster-board">
            <div class="break-section-heading">Draft Board</div>
            <div class="break-roster-list" id="breakRosterList"></div>
          </div>
        </div>
      </main>

      <footer class="board-ticker" id="boardTicker">
        <div class="ticker-row message-row" id="messageRow" hidden>
          <div class="ticker-track" id="messageTrack"></div>
        </div>
        <div class="ticker-row news-row" id="newsRow">
          <div class="ticker-track" id="tickerTrack"></div>
        </div>
      </footer>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="shared/supabase-config.js?v=20260728e"></script>
  <script src="shared/pro.js?v=20260728"></script>
  <script src="shared/data.js?v=20260728h"></script>
  <script src="shared/league-gate.js?v=20260728e"></script>
  <script src="shared/icons.js?v=20260728g"></script>
  <script src="draft-board.js?v=20260728h"></script>
</body>
</html>
