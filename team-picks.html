<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Team Picks</title>
  <link rel="stylesheet" href="shared/theme.css?v=20260728" />
  <link rel="stylesheet" href="shared/league-gate.css?v=20260728" />
  <link rel="stylesheet" href="team-picks.css?v=20260728" />
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen turf-bg">

      <header class="picks-header">
        <button class="back-btn" id="backBtn" hidden>
          <span id="backIcon"></span>
        </button>
        <div class="header-row">
          <h1 class="picks-title">TEAM <span class="gold-text">PICKS</span></h1>
        </div>
      </header>

      <main class="picks-main">

        <a class="recap-banner" id="recapBanner" href="recap.html" hidden>
          <span class="recap-banner-icon" id="recapBannerIcon"></span>
          <span class="recap-banner-text">Draft complete — view the full Recap</span>
        </a>

        <section class="team-picker" id="teamPicker">
          <div class="section-label">Select a Team</div>
          <div class="team-grid" id="teamGrid"></div>
        </section>

        <section class="roster-view" id="rosterView" hidden>
          <div class="team-banner" id="teamBanner"></div>

          <div class="budget-row" id="budgetRow"></div>

          <div class="roster-list" id="rosterList"></div>
        </section>

      </main>

    </div>

    <div class="fab-stack">
      <button class="board-fab" id="exportDraftBtn" aria-label="Export the full draft (CSV)" title="Export the full draft (CSV)"><span id="exportDraftIcon"></span></button>
      <a class="board-fab" id="viewBoardBtn" aria-label="View the full Draft Board" title="View the full Draft Board"><span id="viewBoardIcon"></span></a>
      <button class="board-message-fab" id="messageFab" aria-label="Send a message to the Draft Board">📣</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/supabase-config.js?v=20260728"></script>
  <script src="shared/data.js?v=20260728"></script>
  <script src="shared/league-gate.js?v=20260728"></script>
  <script src="shared/icons.js?v=20260728"></script>
  <script src="team-picks.js?v=20260728"></script>
</body>
</html>
